# Monthly version updates, one grouped PR per ecosystem. Read from main only.
# Alerts and security updates are repo settings, not controlled by this file.
# For pip neither is reliable here: with ranges and no lockfile GitHub knows no
# installed version, so check Python advisories by hand until versions are pinned.
version: 2
updates:
  # Raises each floor to the newest release inside its cap that is 3+ days old
  # (intended). It picks releases for the major.minor in /.python-version, which
  # must match the workflows' python-version. Write a patch that is listed in the
  # pyenv tag pinned by dependabot-core's python/Dockerfile: an unlisted one, even
  # a newer real release, is silently ignored and the newest Python is used.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      # No update-types here: with unpinned ranges Dependabot doesn't know the
      # current version, so that filter would drop every package from the group.
      python:
        patterns: ["*"]
    # These mirror the caps in requirements.txt: change both together. Without
    # them Dependabot raises a cap as soon as a new major ships. (update-types:
    # semver-major can't do this while a floor is a bare number like >=2.)
    # They also block any security update above a cap.
    ignore:
      - dependency-name: "openai"
        versions: [">=3"]
      - dependency-name: "numpy"
        versions: [">=3"]
      - dependency-name: "pytest"
        versions: [">=10"]
      - dependency-name: "langsmith"
        versions: [">=1"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      # Before merging a PR that bumps actions/cache, confirm the new version can
      # restore the old cache (same versionSalt and version hash in its dist):
      # ingest.db is stored nowhere else.
      actions:
        patterns: ["*"]
